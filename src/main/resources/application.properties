spring.application.name=sentinelpay

server.port=8080

# PostgreSQL (Using Environment Variables with fallbacks for local development)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sentinelpay}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:TCETProject}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# PostgreSQL dialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
